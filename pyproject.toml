[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evots-openrouter"
version = "0.1.0"
description = "Independent EvoTS-Agent research implementation with OpenRouter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "ruptures>=1.1.9,<2", "httpx>=0.27,<1", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
forest = ["changeforest>=1.2,<2"]
deep = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10"]
all = ["changeforest>=1.2,<2", "torch>=2.2,<3", "pytest>=8,<10"]

[project.scripts]
evots = "evots.cli:main"

[tool.setuptools.packages.find]
include = ["evots", "evots.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
